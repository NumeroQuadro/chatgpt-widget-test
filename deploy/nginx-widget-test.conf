# Isolated, unauthenticated demo MCP Apps endpoint. It exposes mock data only.
location = /widget-test/mcp {
    client_max_body_size 64k;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_pass http://127.0.0.1:2096/mcp;
}

location = /widget-test/healthz {
    rewrite ^ / break;
    proxy_pass http://127.0.0.1:2096;
}
